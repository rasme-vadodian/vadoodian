server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # فشرده‌سازی پاسخ‌ها
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Health Check برای هم‌روش
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # فایل‌های بیلدشده با هش در نام، کش طولانی دارند
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # مسیرهای SPA مثل /admin و /t/:token باید به index.html برگردند
    location / {
        try_files $uri $uri/ /index.html;
    }
}

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;background-color:#fff8f4;font-family:'Vazirmatn','Plus Jakarta Sans',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: 'class', theme: { extend: { 'colors': { 'on-tertiary-fixed-variant': '#00504b', 'surface-container-highest': '#e9e1db', 'surface-variant': '#e9e1db', 'tertiary-fixed-dim': '#5adacf', 'secondary-fixed': '#ffdcc1', 'outline-variant': '#c3c6d2', 'tertiary-fixed': '#7af6eb', 'on-background': '#1e1b18', 'on-error-container': '#93000a', 'tertiary': '#002926', 'on-secondary-fixed-variant': '#673d12', 'on-tertiary': '#ffffff', 'on-tertiary-container': '#29b5ab', 'primary-fixed': '#d8e2ff', 'surface-container': '#f4ece6', 'surface-container-low': '#faf2ec', 'inverse-primary': '#adc6ff', 'inverse-surface': '#33302c', 'surface-container-high': '#efe7e1', 'on-surface': '#1e1b18', 'on-primary-fixed': '#001a41', 'on-primary-container': '#7fa3ed', 'on-secondary': '#ffffff', 'outline': '#747782', 'on-surface-variant': '#434751', 'primary': '#002252', 'primary-fixed-dim': '#adc6ff', 'background': '#fff8f4', 'error-container': '#ffdad6', 'surface-dim': '#e0d9d3', 'on-error': '#ffffff', 'surface-tint': '#365da2', 'secondary-container': '#febf89', 'error': '#ba1a1a', 'on-primary': '#ffffff', 'primary-container': '#00377b', 'on-tertiary-fixed': '#00201d', 'on-primary-fixed-variant': '#194589', 'secondary-fixed-dim': '#f8ba84', 'surface-bright': '#fff8f4', 'surface': '#fff8f4', 'inverse-on-surface': '#f7efe9', 'surface-container-lowest': '#ffffff', 'tertiar <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<div class="flex flex-col w-full pb-6 px-4 max-w-md mx-auto" style="font-family: 'Markazi Text', serif;">
<!-- Decorative Persian Heritage Header Strip -->
<div class="w-full flex items-center justify-between py-2 text-primary">
<div class="flex items-center gap-1.5 opacity-80">


</div>

</div>
<!-- Emblem & Identity Section -->
<div class="flex flex-col items-center justify-center pt-2 pb-4 text-center">
<div class="relative mb-2">
<div class="w-24 h-24 rounded-full overflow-hidden shadow-md bg-primary-container p-1 flex items-center justify-center">
<img alt="نشان کافه و موزه ودودیان" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAjnnbibp0KG7PnyJCBU2iZjzqKAt_RLAnBBxRefBBNYy82tGLVDVkezDFGCA7V3X-JuIBu_Q9UqphkOd-ElgzS_5mId-oZevI2ZQfkAUQwuFbMeqAKPxqlt5tXoqTnkbbt1bvbqCC_8w-K7VblkCneIco7vlFNI9PPlrani9ZPb4OlqANyjD8ExNfzqOhH8aeirYdadoxXtlNklVcAH2bkyRJ7iTFuX3iHNQ4_zYEdTT1bcQeHQdvFvA">
</div>
<span class="absolute bottom-0 right-0 bg-secondary text-on-secondary rounded-full p-1 shadow-sm flex items-center justify-center">
<span class="material-symbols-outlined text-sm">badge</span>
</span>
</div>
<h1 class="text-3xl font-bold text-primary m-0 leading-tight">ورود مهمانداران سالن</h1>
<p class="text-lg text-secondary m-0 mt-0.5 font-medium">کافه و موزه ودودیان</p>
</div>
<!-- Shift Selection -->
<div class="bg-surface-container-low rounded-xl p-3.5 shadow-sm mb-3.5">
<div class="flex items-center justify-between mb-2">
<span class="text-lg font-bold text-on-surface flex items-center gap-1">
<span class="material-symbols-outlined text-base text-secondary">schedule</span>شیفت کا ری فعال:
      </span>
<span class="text-base text-on-surface-variant font-medium">امروز ۱۲ اردیبهشت</span>
</div>
<div class="grid grid-cols-2 gap-2" id="shift-selector">
<button class="shift-btn flex flex-col items-start p-2.5 rounded-lg bg-primary-container text-on-primary text-right transition-all shadow-sm" onclick="selectShift(this, 'evening')" type="button">
<div class="flex items-center justify-between w-full mb-0.5">
<span class="text-xl font-bold">شیفت عصر</span>
<span class="material-symbols-outlined text-base text-secondary-fixed">wb_twilight</span>
</div>
<span class="text-base opacity-90 font-medium">۱۶:۰۰ الی ۲۴:۰۰</span>
</button>
<button class="shift-btn flex flex-col items-start p-2.5 rounded-lg bg-surface-container text-on-surface text-right transition-all" onclick="selectShift(this, 'morning')" type="button">
<div class="flex items-center justify-between w-full mb-0.5">
<span class="text-xl font-bold">شیفت صبح</span>
<span class="material-symbols-outlined text-base text-secondary">wb_sunny</span>
</div>
<span class="text-base text-on-surface-variant font-medium">۰۸:۰۰ الی ۱۶:۰۰</span>
</button>
</div>
</div>
<!-- Waiter Quick Select -->
<div class="bg-surface-container-low rounded-xl p-3.5 shadow-sm mb-3.5">
<div class="flex items-center justify-between mb-2.5">
<label class="text-lg font-bold text-on-surface flex items-center gap-1">
<span class="material-symbols-outlined text-base text-secondary">person</span>
        انتخاب سریع مهماندار یا کد:
      </label>

</div>
<!-- Quick Chips for Fast Touch on Shift -->
<div class="grid grid-cols-3 gap-1.5 mb-2.5">
<button class="waiter-chip py-2 px-1 rounded-lg bg-surface text-center shadow-xs text-on-surface transition-all active:scale-95" onclick="pickWaiter('علی رضایی', '۱۰۲۴', this)" type="button">
<div class="text-lg font-bold leading-none">علی رضایی</div>
<div class="text-base text-secondary mt-0.5">کد ۱۰۲۴</div>
</button>
<button class="waiter-chip py-2 px-1 rounded-lg bg-surface text-center shadow-xs text-on-surface transition-all active:scale-95" onclick="pickWaiter('سارا معتمد', '۲۰۸۱', this)" type="button">
<div class="text-lg font-bold leading-none">سارا معتمد</div>
<div class="text-base text-secondary mt-0.5">کد ۲۰۸۱</div>
</button>
<button class="waiter-chip py-2 px-1 rounded-lg bg-surface text-center shadow-xs text-on-surface transition-all active:scale-95" onclick="pickWaiter('رضا کمالی', '۳۱۵۵', this)" type="button">
<div class="text-lg font-bold leading-none">رضا کمالی</div>
<div class="text-base text-secondary mt-0.5">کد ۳۱۵۵</div>
</button>
</div>
<!-- Manual Code Fallback -->
<div class="relative flex items-center">

<span class="material-symbols-outlined absolute right-2.5 text-secondary text-lg pointer-events-none">pin</span>
</div>
</div>
<!-- Quick Handheld PIN Pad Interface -->
<div class="bg-surface-container-low rounded-xl p-3.5 shadow-sm mb-4">
<div class="flex items-center justify-between mb-2">
<div class="text-lg font-bold text-on-surface flex items-center gap-1">
<span class="material-symbols-outlined text-base text-secondary">lock</span>
        پین‌کد ورود سریع (۴ رقم):
      </div>
<button class="text-base text-secondary hover:text-on-secondary-fixed-variant font-bold" onclick="clearPin()" type="button">
        پاک کردن
      </button>
</div>
<!-- PIN Visual Dots -->
<div class="flex items-center justify-center gap-4 py-2 mb-3 bg-surface rounded-lg">
<div class="w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-all duration-150" id="dot-0"></div>
<div class="w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-all duration-150" id="dot-1"></div>
<div class="w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-all duration-150" id="dot-2"></div>
<div class="w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-all duration-150" id="dot-3"></div>
</div>
<!-- Fast One-Handed Numeric Keypad for Mobile -->
<div class="grid grid-cols-3 gap-2">
<button class="h-11 rounded-lg bg-surface text-2xl font-bold text-on-surface shadow-xs active:bg-secondary-container transition-all flex items-center justify-center" onclick="appendPin('۱')" type="button">۱</button>
<button class="h-11 rounded-lg bg-surface text-2xl font-bold text-on-surface shadow-xs active:bg-secondary-container transition-all flex items-center justify-center" onclick="appendPin('۲')" type="button">۲</button>
<button class="h-11 rounded-lg bg-surface text-2xl font-bold text-on-surface shadow-xs active:bg-secondary-container transition-all flex items-center justify-center" onclick="appendPin('۳')" type="button">۳</button>
<button class="h-11 rounded-lg bg-surface text-2xl font-bold text-on-surface shadow-xs active:bg-secondary-container transition-all flex items-center justify-center" onclick="appendPin('۴')" type="button">۴</button>
<button class="h-11 rounded-lg bg-surface text-2xl font-bold text-on-surface shadow-xs active:bg-secondary-container transition-all flex items-center justify-center" onclick="appendPin('۵')" type="button">۵</button>
<button class="h-11 rounded-lg bg-surface text-2xl font-bold text-on-surface shadow-xs active:bg-secondary-container transition-all flex items-center justify-center" onclick="appendPin('۶')" type="button">۶</button>
<button class="h-11 rounded-lg bg-surface text-2xl font-bold text-on-surface shadow-xs active:bg-secondary-container transition-all flex items-center justify-center" onclick="appendPin('۷')" type="button">۷</button>
<button class="h-11 rounded-lg bg-surface text-2xl font-bold text-on-surface shadow-xs active:bg-secondary-container transition-all flex items-center justify-center" onclick="appendPin('۸')" type="button">۸</button>
<button class="h-11 rounded-lg bg-surface text-2xl font-bold text-on-surface shadow-xs active:bg-secondary-container transition-all flex items-center justify-center" onclick="appendPin('۹')" type="button">۹</button>
<button class="h-11 rounded-lg bg-surface-container text-lg font-bold text-on-surface-variant shadow-xs active:bg-surface-variant transition-all flex items-center justify-center" onclick="clearPin()" type="button">
        لغو
      </button>
<button class="h-11 rounded-lg bg-surface text-2xl font-bold text-on-surface shadow-xs active:bg-secondary-container transition-all flex items-center justify-center" onclick="appendPin('۰')" type="button">۰</button>
<button class="h-11 rounded-lg bg-surface-container text-on-surface-variant shadow-xs active:bg-surface-variant transition-all flex items-center justify-center" onclick="popPin()" type="button">
<span class="material-symbols-outlined text-xl">backspace</span>
</button>
</div>
</div>
<!-- Primary Entrance Action -->
<button class="w-full bg-primary-container text-on-primary py-3 px-4 rounded-xl shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2 mb-3 cursor-pointer" id="submit-login-btn" onclick="submitLogin()" type="button">
<span class="material-symbols-outlined text-2xl">login</span>
<span class="text-2xl font-bold tracking-wide">ورود به شیفت و سالن</span>
</button>
<!-- Notice and Help Callout -->
<div class="bg-surface-container rounded-lg p-2.5 flex items-start gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-secondary text-xl mt-0.5 shrink-0">info</span>
<p class="text-base leading-snug m-0">
      در صورت فراموشی پین یا تغییر شیفت با مدیر شیفت سالن هماهنگ کنید.
    </p>
</div>
</div>
<script>
  let enteredPin = "";
  let selectedShift = "evening";
  let activeWaiterName = "";
  let activeWaiterCode = "";

  function updateDots() {
    for (let i = 0; i < 4; i++) {
      const dot = document.getElementById(`dot-${i}`);
      if (i < enteredPin.length) {
        dot.className = "w-3.5 h-3.5 rounded-full bg-primary shadow-xs transition-all duration-150 scale-110";
      } else {
        dot.className = "w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-all duration-150";
      }
    }
  }

  function appendPin(digit) {
    if (enteredPin.length < 4) {
      enteredPin += digit;
      updateDots();
      if (enteredPin.length === 4) {
        const btn = document.getElementById("submit-login-btn");
        btn.classList.add("ring-2", "ring-secondary");
      }
    }
  }

  function popPin() {
    if (enteredPin.length > 0) {
      enteredPin = enteredPin.slice(0, -1);
      updateDots();
    }
  }

  function clearPin() {
    enteredPin = "";
    updateDots();
  }

  function selectShift(button, shiftType) {
    selectedShift = shiftType;
    document.querySelectorAll(".shift-btn").forEach(btn => {
      btn.className = "shift-btn flex flex-col items-start p-2.5 rounded-lg bg-surface-container text-on-surface text-right transition-all";
      const icon = btn.querySelector(".material-symbols-outlined");
      if (icon) icon.className = "material-symbols-outlined text-base text-secondary";
    });

    button.className = "shift-btn flex flex-col items-start p-2.5 rounded-lg bg-primary-container text-on-primary text-right transition-all shadow-sm";
    const activeIcon = button.querySelector(".material-symbols-outlined");
    if (activeIcon) activeIcon.className = "material-symbols-outlined text-base text-secondary-fixed";
  }

  function pickWaiter(name, code, element) {
    activeWaiterName = name;
    activeWaiterCode = code;

    document.querySelectorAll(".waiter-chip").forEach(c => {
      c.className = "waiter-chip py-2 px-1 rounded-lg bg-surface text-center shadow-xs text-on-surface transition-all active:scale-95";
    });

    element.className = "waiter-chip py-2 px-1 rounded-lg bg-secondary text-on-secondary text-center shadow-sm transition-all active:scale-95";

    const badge = document.getElementById("waiter-status-badge");
    badge.textContent = name;
    badge.className = "text-base text-on-primary font-bold bg-primary px-2 py-0.5 rounded-md";

    const manualInput = document.getElementById("manual-code-input");
    manualInput.value = code;
  }

  function onManualInput(val) {
    if (val.length > 0) {
      document.querySelectorAll(".waiter-chip").forEach(c => {
        c.className = "waiter-chip py-2 px-1 rounded-lg bg-surface text-center shadow-xs text-on-surface transition-all active:scale-95";
      });
      activeWaiterName = "مهماندار " + val;
      activeWaiterCode = val;
      const badge = document.getElementById("waiter-status-badge");
      badge.textContent = "کد " + val;
      badge.className = "text-base text-on-secondary font-bold bg-secondary px-2 py-0.5 rounded-md";
    }
  }

  function submitLogin() {
    if (!activeWaiterCode && !document.getElementById("manual-code-input").value) {
      alert("لطفاً ابتدا نام یا کد مهماندار را انتخاب فرمایید.");
      return;
    }
    if (enteredPin.length < 4) {
      alert("لطفاً پین‌کد ۴ رقمی خود را وارد نمایید.");
      return;
    }
    const btn = document.getElementById("submit-login-btn");
    btn.innerHTML = `<span class="material-symbols-outlined text-2xl animate-spin">sync</span><span class="text-2xl font-bold">در حال اتصال به میزهای سالن...</span>`;
    setTimeout(() => {
      btn.innerHTML = `<span class="material-symbols-outlined text-2xl">check_circle</span><span class="text-2xl font-bold">ورود موفق به سالن</span>`;
      btn.classList.remove("bg-primary-container");
      btn.classList.add("bg-tertiary-container", "text-on-tertiary");
    }, 800);
  }
</script></main>



</body></html>

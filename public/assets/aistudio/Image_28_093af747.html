<script>
  let basePrice = 125000;
  let beanExtra = 0;
  let pairingsExtra = 0;
  let quantity = 1;

  function formatToman(num) {
    return num.toLocaleString('fa-IR');
  }

  function updateTotal() {
    const singleItemTotal = basePrice + beanExtra;
    const grandTotal = (singleItemTotal * quantity) + pairingsExtra;
    document.getElementById('total-button-price').innerText = formatToman(grandTotal);
  }

  function adjustQuantity(delta) {
    const newQty = quantity + delta;
    if (newQty >= 1 && newQty <= 10) {
      quantity = newQty;
      document.getElementById('quantity-display').innerText = quantity.toLocaleString('fa-IR');
      document.getElementById('btn-decrement').disabled = (quantity === 1);
      updateTotal();
    }
  }

  function selectOption(button, groupType) {
    const parentContainer = button.parentElement;
    const siblings = parentContainer.querySelectorAll('.option-pill');
    
    siblings.forEach(el => {
      el.classList.remove('active-option', 'bg-surface-container-lowest', 'shadow-sm');
      el.classList.add('bg-surface-container');
      const radio = el.querySelector('.radio-indicator');
      if (radio) {
        radio.classList.remove('bg-primary', 'text-surface-bright');
        radio.classList.add('bg-surface-container-highest');
        const innerDot = radio.querySelector('span');
        if (innerDot) innerDot.classList.replace('bg-surface-bright', 'bg-transparent');
      }
    });

    button.classList.add('active-option', 'bg-surface-container-lowest', 'shadow-sm');
    button.classList.remove('bg-surface-container');

    const activeRadio = button.querySelector('.radio-indicator');
    if (activeRadio) {
      activeRadio.classList.add('bg-primary', 'text-surface-bright');
      activeRadio.classList.remove('bg-surface-container-highest');
      const innerDot = activeRadio.querySelector('span');
      if (innerDot) innerDot.classList.replace('bg-transparent', 'bg-surface-bright');
    }

    if (groupType === 'bean') {
      const isEthiopia = button.innerText.includes('اتیوپی');
      beanExtra = isEthiopia ? 15000 : 0;
    }

    updateTotal();
  }

  function togglePairing(button, price) {
    const isAdded = button.getAttribute('data-added') === 'true';
    if (!isAdded) {
      button.setAttribute('data-added', 'true');
      button.classList.remove('bg-surface-container-high', 'text-primary');
      button.classList.add('bg-primary', 'text-surface-bright');
      button.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span>';
      pairingsExtra += price;
    } else {
      button.setAttribute('data-added', 'false');
      button.classList.remove('bg-primary', 'text-surface-bright');
      button.classList.add('bg-surface-container-high', 'text-primary');
      button.innerHTML = '<span class="material-symbols-outlined text-[18px]">add</span>';
      pairingsExtra -= price;
    }
    updateTotal();
  }

  function handleAddToCart() {
    const toast = document.getElementById('toast-notification');
    toast.classList.remove('-translate-y-12', 'opacity-0', 'pointer-events-none');
    toast.classList.add('translate-y-0', 'opacity-100');

    setTimeout(() => {
      toast.classList.add('-translate-y-12', 'opacity-0', 'pointer-events-none');
      toast.classList.remove('translate-y-0', 'opacity-100');
    }, 2800);
  }

  // Initialize display
  updateTotal();
</script><div class="fixed bottom-6 z-50 flex items-center inset-x-0 justify-center"><button type="button" aria-label="صدا کردن ویتر" class="flex items-center gap-2 px-4 py-3 bg-primary-container text-surface-bright rounded-full shadow-lg border border-secondary/40 active:scale-95 transition-all hover:bg-primary"><svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-secondary-fixed fill-current flex-shrink-0" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"></path></svg><span class="font-title-md text-body-md font-semibold text-surface-bright"><span style="color: rgb(255, 255, 255); white-space: nowrap; background-color: rgb(0, 54, 122);" class="">فراخوانی مهماندار</span></span></button></div></main>
